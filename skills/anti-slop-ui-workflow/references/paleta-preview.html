<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paletas — escolha ou ajuste</title>
<!--
  TEMPLATE da skill anti-slop-ui-workflow (passo "Briefing").
  Gerado por scripts/paleta.py (edite PALETAS lá) ou copie e edite o array abaixo.
  Cada card é EDITÁVEL: clique em qualquer amostra para abrir o seletor de cor do sistema,
  troque as fontes no menu, veja o mockup mudar. "Copiar tokens" gera o :root + JSON —
  cole no chat do agente. "Duplicar" cria um card livre a partir de qualquer paleta.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&family=Instrument+Serif&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono&family=DM+Sans:wght@400;700&family=Manrope:wght@400;800&family=Literata:wght@400;700&family=Public+Sans:wght@400;700&family=Fira+Code&display=swap" rel="stylesheet">
<style>
  :root { font-size: 16px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e9e6; color: #1a1a1a; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .hint { color: #555; margin: 0 0 20px; font-size: 14px; max-width: 90ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; }
  .card { border: 1px solid #cfcfca; background: #fff; display: grid; grid-template-rows: auto auto auto 1fr auto; }
  .card header { padding: 10px 16px; border-bottom: 1px solid #e3e3df; display: flex; gap: 12px; align-items: baseline; }
  .card header input[type=text] { font: 600 17px/1.2 system-ui; border: 0; border-bottom: 1px dashed #bbb; background: none; min-width: 0; flex: 1; }
  .card header .mood { font-size: 13px; color: #666; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); }
  .sw { position: relative; height: 62px; display: flex; flex-direction: column; justify-content: flex-end; padding: 4px; font: 10px/1.25 ui-monospace, monospace; cursor: pointer; }
  .sw input[type=color] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .sw:focus-within { outline: 2px solid #1a1a1a; outline-offset: -2px; }
  .fonts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #e3e3df; font-size: 12px; }
  .fonts label { display: grid; gap: 2px; color: #666; }
  .fonts select { font-size: 13px; padding: 4px; }
  .mock { padding: 20px; min-height: 230px; }
  .mock .kicker { font-family: var(--mono); font-size: 12px; opacity: .7; margin-bottom: 8px; }
  .mock h2 { margin: 0 0 8px; font-size: 30px; line-height: 1.1; font-family: var(--display); }
  .mock p { margin: 0 0 14px; max-width: 46ch; opacity: .85; }
  .mock .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .mock .btn { padding: 8px 14px; border: 1px solid; font-weight: 600; font-size: 14px; }
  .mock .row { display: flex; gap: 8px; font: 12px/1 var(--mono); flex-wrap: wrap; }
  .mock .row span { padding: 4px 8px; border: 1px solid; }
  .mock .field { display: grid; gap: 4px; margin-top: 12px; max-width: 320px; font-size: 13px; }
  .mock .field div { border: 1px solid; padding: 8px 10px; font-family: var(--mono); font-size: 14px; }
  .actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e3e3df; align-items: center; flex-wrap: wrap; }
  .actions button { font: 600 13px system-ui; padding: 7px 12px; border: 1px solid #1a1a1a; background: #fff; cursor: pointer; }
  .actions button.primary { background: #1a1a1a; color: #fff; }
  .actions .contrast { font: 12px ui-monospace, monospace; color: #555; margin-left: auto; }
  .actions .contrast b.bad { color: #b3261e; }
  .out { grid-column: 1 / -1; }
  .out textarea { width: 100%; min-height: 180px; font: 12px/1.45 ui-monospace, monospace; padding: 10px; border: 1px solid #cfcfca; }
  .out .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .out .bar button { font: 600 13px system-ui; padding: 7px 12px; border: 1px solid #1a1a1a; background: #1a1a1a; color: #fff; cursor: pointer; }
  .out .bar span { font-size: 13px; color: #555; }
  @media (prefers-reduced-motion: no-preference) { .sw { transition: filter .12s; } .sw:hover { filter: brightness(.96); } }
</style>
</head>
<body>
<h1>Paletas para: <span id="projeto"></span></h1>
<p class="hint">Cada card é uma direção completa (cor + tipografia) e é <b>editável</b>: clique numa amostra para abrir o seletor de cor do sistema, troque as fontes, veja o mockup mudar. Quando gostar, clique em <b>Copiar tokens</b> e cole o resultado no chat. Se preferir só escolher, responda com o número.</p>
<div class="grid" id="grid"></div>
<script>
// ===== EDITE SÓ ISTO =====
const PROJETO = "Nome do projeto";
const PALETAS = [
  { nome: "1 · Folha industrial", mood: "papel frio, carimbo, denso",
    bg: "#F3F2EE", surface: "#FFFFFF", ink: "#16171A", ink2: "#5B5D63", brand: "#C43A14",
    ok: "#1F7A3E", err: "#B3261E", warn: "#9A6700",
    display: "'Archivo', sans-serif", text: "'IBM Plex Sans', sans-serif", mono: "'IBM Plex Mono', monospace" },
  { nome: "2 · Editorial", mood: "serifa de display, claro, calmo",
    bg: "#FBFAF7", surface: "#FFFFFF", ink: "#1C1B18", ink2: "#66625A", brand: "#1F4B99",
    ok: "#2E7D4F", err: "#B42318", warn: "#B54708",
    display: "'Instrument Serif', serif", text: "'Source Sans 3', sans-serif", mono: "'JetBrains Mono', monospace" },
  { nome: "3 · Painel escuro sóbrio", mood: "dark sem neon, cinza quente, âmbar",
    bg: "#141416", surface: "#1D1D20", ink: "#EDEDEA", ink2: "#A3A39E", brand: "#E0A030",
    ok: "#5BBF7A", err: "#F26D5B", warn: "#E0A030",
    display: "'Manrope', sans-serif", text: "'DM Sans', sans-serif", mono: "'JetBrains Mono', monospace" },
  { nome: "4 · Verde de fábrica", mood: "claro, verde escuro como marca, técnico",
    bg: "#F4F6F3", surface: "#FFFFFF", ink: "#141A16", ink2: "#5A665E", brand: "#0F5C3A",
    ok: "#0F5C3A", err: "#A8321F", warn: "#8A6100",
    display: "'DM Sans', sans-serif", text: "'DM Sans', sans-serif", mono: "'IBM Plex Mono', monospace" },
];
// ===== FIM =====
const CHAVES = ['bg','surface','ink','ink2','brand','ok','err','warn'];
const FONTES = {
  display: ["'Archivo', sans-serif","'Instrument Serif', serif","'Literata', serif","'Manrope', sans-serif","'DM Sans', sans-serif","'Public Sans', sans-serif","'IBM Plex Sans', sans-serif"],
  text: ["'IBM Plex Sans', sans-serif","'Source Sans 3', sans-serif","'DM Sans', sans-serif","'Public Sans', sans-serif","'Literata', serif","'Manrope', sans-serif"],
  mono: ["'IBM Plex Mono', monospace","'JetBrains Mono', monospace","'Fira Code', monospace","ui-monospace, monospace"],
};
const nomeFonte = f => f.split(',')[0].replace(/'/g,'');
const lum = h => { const [r,g,b] = h.match(/\w\w/g).map(x => parseInt(x,16)/255).map(c => c<=.03928?c/12.92:((c+.055)/1.055)**2.4); return .2126*r+.7152*g+.0722*b; };
const ratio = (a,b) => { const l1=lum(a), l2=lum(b); return ((Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)).toFixed(1); };
const textoSobre = h => lum(h) > .4 ? '#111' : '#fff';

const grid = document.getElementById('grid');
document.getElementById('projeto').textContent = PROJETO;
const out = document.createElement('div'); out.className = 'out';
out.innerHTML = `<div class="bar"><button id="copiar">Copiar tokens</button><span id="status">Clique em "Copiar tokens" num card — o resultado aparece aqui e vai para a área de transferência.</span></div><textarea id="tokens" readonly></textarea>`;

function render(p, idx) {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `
    <header><input type="text" value="${p.nome}" aria-label="nome da paleta"><span class="mood">${p.mood || ''}</span></header>
    <div class="swatches">${CHAVES.map(k => `<label class="sw" data-k="${k}"><input type="color" value="${p[k]}" aria-label="${k}"><span>${k}</span><span class="hex">${p[k]}</span></label>`).join('')}</div>
    <div class="fonts">${['display','text','mono'].map(k => `<label>${k}<select data-f="${k}">${FONTES[k].map(f => `<option value="${f}" ${f===p[k]?'selected':''}>${nomeFonte(f)}</option>`).join('')}${FONTES[k].includes(p[k])?'':`<option value="${p[k]}" selected>${nomeFonte(p[k])}</option>`}</select></label>`).join('')}</div>
    <div class="mock">
      <div class="kicker"></div>
      <h2>Pipelines que o time inteiro consegue ler.</h2>
      <p>Um arquivo de dez linhas, cache que se configura sozinho e um log que aponta a linha que quebrou.</p>
      <div class="btns"><span class="btn b1">Ação principal</span><span class="btn b2">Secundária</span></div>
      <div class="row"><span class="s-ok">✓ passou</span><span class="s-err">✕ falhou</span><span class="s-warn">! aviso</span><span class="s-mut">— pulado</span></div>
      <div class="field"><span>E-mail</span><div class="inp">voce@empresa.com.br</div></div>
    </div>
    <div class="actions"><button class="primary copiar">Copiar tokens</button><button class="dup">Duplicar</button><span class="contrast"></span></div>`;
  const q = s => c.querySelector(s);
  function pintar() {
    CHAVES.forEach(k => { const el = q(`.sw[data-k=${k}]`); el.style.background = p[k]; el.style.color = textoSobre(p[k]); el.querySelector('.hex').textContent = p[k].toUpperCase(); });
    const m = q('.mock');
    m.style.cssText = `background:${p.bg};color:${p.ink};--display:${p.display};--mono:${p.mono};font-family:${p.text}`;
    q('.kicker').textContent = `${nomeFonte(p.display)} + ${nomeFonte(p.text)} + ${nomeFonte(p.mono)}`;
    q('.b1').style.cssText = `background:${p.brand};color:${textoSobre(p.brand)};border-color:${p.brand}`;
    q('.b2').style.cssText = `background:${p.surface};color:${p.ink};border-color:${p.ink2}`;
    q('.s-ok').style.cssText = `color:${p.ok};border-color:${p.ok}`;
    q('.s-err').style.cssText = `color:${p.err};border-color:${p.err}`;
    q('.s-warn').style.cssText = `color:${p.warn};border-color:${p.warn}`;
    q('.s-mut').style.cssText = `color:${p.ink2};border-color:${p.ink2}`;
    q('.inp').style.cssText = `background:${p.surface};color:${p.ink};border-color:${p.ink2}`;
    const r1 = ratio(p.ink, p.bg), r2 = ratio(p.ink2, p.bg), r3 = ratio(textoSobre(p.brand), p.brand);
    q('.contrast').innerHTML = `contraste — tinta ${r1}:1 · secundária <b class="${r2<4.5?'bad':''}">${r2}:1</b> · botão <b class="${r3<4.5?'bad':''}">${r3}:1</b> (AA ≥ 4.5)`;
  }
  c.querySelectorAll('input[type=color]').forEach(i => i.addEventListener('input', e => { p[e.target.closest('.sw').dataset.k] = e.target.value.toUpperCase(); pintar(); }));
  c.querySelectorAll('select').forEach(s => s.addEventListener('change', e => { p[e.target.dataset.f] = e.target.value; pintar(); }));
  q('header input').addEventListener('input', e => p.nome = e.target.value);
  q('.copiar').addEventListener('click', () => exportar(p));
  q('.dup').addEventListener('click', () => { const n = {...p, nome: p.nome.replace(/^\d+ · /, '') + ' (cópia)', mood: 'ajuste livre'}; PALETAS.push(n); grid.insertBefore(render(n), out); });
  pintar();
  return c;
}
function exportar(p) {
  const css = `:root {\n  --bg: ${p.bg};\n  --surface: ${p.surface};\n  --ink: ${p.ink};\n  --ink-2: ${p.ink2};\n  --brand: ${p.brand};\n  --ok: ${p.ok};\n  --err: ${p.err};\n  --warn: ${p.warn};\n  --font-display: ${p.display};\n  --font-text: ${p.text};\n  --font-mono: ${p.mono};\n}`;
  const txt = `/* paleta: ${p.nome} */\n${css}\n\n${JSON.stringify(p)}`;
  const ta = document.getElementById('tokens'); ta.value = txt;
  const st = document.getElementById('status');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => st.textContent = `Copiado: ${p.nome}. Cole no chat.`, () => { ta.select(); st.textContent = 'Selecionado — Ctrl+C para copiar e cole no chat.'; });
  out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
PALETAS.forEach((p, i) => grid.appendChild(render(p, i)));
grid.appendChild(out);
document.getElementById('copiar').addEventListener('click', () => { const ta = document.getElementById('tokens'); if (ta.value) { ta.select(); navigator.clipboard && navigator.clipboard.writeText(ta.value); } });
</script>
</body>
</html>
